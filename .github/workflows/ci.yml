name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Compile examples
        shell: bash
        run: |
          failed=0
          for f in examples/*.mirr; do
            name=$(basename "$f")
            case "$name" in
              malformed_input.mirr|validation_errors.mirr)
                echo "SKIP (error case): $f"
                continue
                ;;
              flight_controller_signed.mirr)
                echo "SKIP (signed guard lowering not yet supported): $f"
                continue
                ;;
            esac
            echo "COMPILE: $f"
            if ! cargo run --bin mirr-compile -- --emit verilog "$f" > /dev/null 2>&1; then
              echo "FAIL: $f"
              cargo run --bin mirr-compile -- --emit verilog "$f" 2>&1 || true
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more example files failed to compile"
            exit 1
          fi
          echo "All examples compiled successfully"

  coverage:
    name: Code Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-coverage-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --out xml --skip-clean --packages nasa-rust-project lra-cli

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: cobertura.xml

  supply-chain:
    name: Supply Chain Audit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true

  simulate:
    name: RTL Simulation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-sim-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-sim-

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run RTL simulations
        run: bash tests/sim/run_sim.sh

  wasm-build:
    name: WASM Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-wasm-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM crate
        run: wasm-pack build crates/mirr-wasm --target web --out-dir ../../demos --release

      - name: Verify WASM output
        run: |
          test -f demos/mirr_wasm_bg.wasm || { echo "FAIL: missing mirr_wasm_bg.wasm"; exit 1; }
          test -f demos/mirr_wasm.js || { echo "FAIL: missing mirr_wasm.js"; exit 1; }
          echo "WASM build OK: .wasm + .js glue present"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirr-wasm
          path: demos/

  proofs:
    name: Coq Proofs
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Coq
        run: |
          sudo apt-get update && sudo apt-get install -y coq
          coqc --version

      - name: Build width proofs
        run: make -C proofs/width
      - name: Build rspu proofs
        run: make -C proofs/rspu

      - name: Verify Admitted count within budget
        run: |
          COUNT=$(grep -r "Admitted\." proofs/ | wc -l)
          echo "Admitted count: $COUNT"
          test "$COUNT" -le 20

  lra-cli:
    name: LRA CLI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-lra-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-lra-

      - name: Check formatting (lra-cli)
        run: cargo fmt -p lra-cli -- --check

      - name: Run clippy (lra-cli)
        run: cargo clippy -p lra-cli --all-targets -- -D warnings

      - name: Build lra-cli
        run: cargo build -p lra-cli

      - name: Run lra-cli tests
        run: cargo test -p lra-cli

      - name: Validate MIRR paper
        run: cd paper && cargo run -p lra-cli -- validate index.html

      - name: Validate template
        run: cd template && cargo run -p lra-cli -- validate index.html

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: [wasm-build, lra-cli]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@4eb9f110bac952a8b68ecf92e3b5c7a987594ba6 # v1.292.0
        with:
          ruby-version: '3.3'
          working-directory: docs
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build Jekyll site
        run: |
          cd docs
          bundle exec jekyll build --destination ../_site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Download WASM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mirr-wasm
          path: _wasm/

      - name: Assemble paper into site
        run: |
          mkdir -p _site/paper/demos

          # Copy paper source files (single source of truth: paper/)
          cp paper/index.html paper/paper.css paper/paper.js paper/sw.js _site/paper/
          cp paper/lra-card.svg paper/lra-client.js _site/paper/
          cp paper/LICENSE paper/CITATION.cff _site/paper/

          # Copy WASM build artifacts
          cp _wasm/mirr_wasm.js _site/paper/demos/
          cp _wasm/mirr_wasm_bg.wasm _site/paper/demos/

          # Inject build metadata
          HASH=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          sed -i "s/id=\"commit-hash\">dev/id=\"commit-hash\">$HASH/g" _site/paper/index.html
          sed -i "s/id=\"footer-hash\">dev/id=\"footer-hash\">$HASH/g" _site/paper/index.html
          echo "Assembled paper with commit=$HASH version=$VERSION"

      - name: Verify paper structure
        run: |
          test -f _site/paper/index.html || { echo "FAIL: missing index.html"; exit 1; }
          test -f _site/paper/paper.js || { echo "FAIL: missing paper.js"; exit 1; }
          test -f _site/paper/demos/mirr_wasm.js || { echo "FAIL: missing mirr_wasm.js"; exit 1; }
          test -f _site/paper/demos/mirr_wasm_bg.wasm || { echo "FAIL: missing mirr_wasm_bg.wasm"; exit 1; }
          echo "Paper verification: all 4 critical files present"
          ls -la _site/paper/demos/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
