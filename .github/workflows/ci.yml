name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Compile examples
        shell: bash
        run: |
          failed=0
          for f in examples/*.mirr; do
            name=$(basename "$f")
            # Skip intentional error-case files
            case "$name" in
              malformed_input.mirr|validation_errors.mirr)
                echo "SKIP (error case): $f"
                continue
                ;;
              flight_controller_signed.mirr)
                echo "SKIP (signed guard lowering not yet supported): $f"
                continue
                ;;
            esac
            echo "COMPILE: $f"
            if ! cargo run --bin mirr-compile -- --emit verilog "$f" > /dev/null 2>&1; then
              echo "FAIL: $f"
              cargo run --bin mirr-compile -- --emit verilog "$f" 2>&1 || true
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more example files failed to compile"
            exit 1
          fi
          echo "All examples compiled successfully"
