name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Compile examples
        shell: bash
        run: |
          failed=0
          for f in examples/*.mirr; do
            name=$(basename "$f")
            case "$name" in
              malformed_input.mirr|validation_errors.mirr)
                echo "SKIP (error case): $f"
                continue
                ;;
              flight_controller_signed.mirr)
                echo "SKIP (signed guard lowering not yet supported): $f"
                continue
                ;;
            esac
            echo "COMPILE: $f"
            if ! cargo run --bin mirr-compile -- --emit verilog "$f" > /dev/null 2>&1; then
              echo "FAIL: $f"
              cargo run --bin mirr-compile -- --emit verilog "$f" 2>&1 || true
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more example files failed to compile"
            exit 1
          fi
          echo "All examples compiled successfully"

  coverage:
    name: Code Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-coverage-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --out xml --skip-clean --packages nasa-rust-project lra-cli

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: cobertura.xml

  supply-chain:
    name: Supply Chain Audit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true

  simulate:
    name: RTL Simulation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-sim-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-sim-

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run RTL simulations
        run: bash tests/sim/run_sim.sh

  wasm-build:
    name: WASM Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-wasm-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM crate
        run: wasm-pack build crates/mirr-wasm --target web --out-dir ../../demos --release

      - name: Verify WASM output
        run: test -f demos/mirr_wasm_bg.wasm && echo "WASM build OK"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirr-wasm
          path: demos/

  proofs:
    name: Coq Proofs
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Coq
        run: sudo apt-get update && sudo apt-get install -y coq

      - name: Build width proofs
        run: make -C proofs/width
      - name: Build rspu proofs
        run: make -C proofs/rspu

      - name: Verify Admitted count within budget
        run: |
          COUNT=$(grep -r "Admitted\." proofs/ | wc -l)
          echo "Admitted count: $COUNT"
          test "$COUNT" -le 20

  lra-cli:
    name: LRA CLI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-lra-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-lra-

      - name: Check formatting (lra-cli)
        run: cargo fmt -p lra-cli -- --check

      - name: Run clippy (lra-cli)
        run: cargo clippy -p lra-cli --all-targets -- -D warnings

      - name: Build lra-cli
        run: cargo build -p lra-cli

      - name: Run lra-cli tests
        run: cargo test -p lra-cli

      - name: Validate MIRR paper
        run: cd paper && cargo run -p lra-cli -- validate index.html

      - name: Validate template
        run: cd template && cargo run -p lra-cli -- validate index.html

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: [wasm-build, lra-cli]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download WASM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mirr-wasm
          path: demos/

      - name: Prepare paper for docs site
        run: |
          # Copy paper into docs/paper/ so Jekyll serves it at /mirr-project/paper/
          mkdir -p docs/paper/demos
          cp paper/index.html paper/paper.css paper/paper.js paper/sw.js docs/paper/
          cp paper/lra-card.svg paper/lra-client.js docs/paper/ 2>/dev/null || true
          cp paper/LICENSE paper/CITATION.cff docs/paper/ 2>/dev/null || true
          cp -r demos/* docs/paper/demos/

          # Inject build metadata
          HASH=$(git rev-parse --short HEAD)
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          sed -i "s/id=\"commit-hash\">dev/id=\"commit-hash\">$HASH/g" docs/paper/index.html
          sed -i "s/id=\"footer-hash\">dev/id=\"footer-hash\">$HASH/g" docs/paper/index.html
          echo "Injected commit=$HASH version=$VERSION"

      - name: Commit paper to docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/paper/
          if git diff --cached --quiet; then
            echo "No changes to paper, skipping commit"
          else
            git commit -m "ci: deploy interactive paper to docs/paper/ [skip ci]"
            git push
          fi
