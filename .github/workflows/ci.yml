name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "false"
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --all --locked

      - name: Build docs
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Run coverage
        run: cargo llvm-cov nextest --all --locked --codecov --output-path codecov.json

  supply-chain:
    name: Supply Chain
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  simulate:
    name: RTL Simulation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run simulations
        run: bash tests/sim/run_sim.sh

  wasm-build:
    name: WASM Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.7
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM
        run: wasm-pack build crates/mirr-wasm --target web --out-dir ../../demos --release
      - name: Build Arsenal WASM
        run: wasm-pack build crates/mirr-arsenal-wasm --target web --out-dir ../../target/arsenal-wasm --release
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirr-wasm
          path: demos/

  pages-deploy:
    name: Deploy
    needs: [test, coverage, supply-chain, simulate, wasm-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build docs
        run: cargo run -p lra-cli -- build-docs docs -o _site
      - name: Copy assets
        run: |
          mkdir -p _site/assets/images _site/paper/demos
          cp -r docs/assets/images/* _site/assets/images/ 2>/dev/null || true
          cp paper/index.html paper/paper.css paper/paper.js paper/sw.js _site/paper/
          cp paper/lra-card.svg paper/lra-client.js _site/paper/
          cp paper/LICENSE paper/CITATION.cff _site/paper/
      - name: Download WASM
        uses: actions/download-artifact@v4
        with:
          name: mirr-wasm
          path: _wasm/
      - name: Inject metadata
        run: |
          cp _wasm/mirr_wasm.js _site/paper/demos/
          cp _wasm/mirr_wasm_bg.wasm _site/paper/demos/
          HASH=$(git rev-parse --short HEAD)
          sed -i "s/id=\"commit-hash\">dev/id=\"commit-hash\">$HASH/g" _site/paper/index.html
          sed -i "s/id=\"footer-hash\">dev/id=\"footer-hash\">$HASH/g" _site/paper/index.html
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
