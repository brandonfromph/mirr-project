# cargo-deny configuration — supply chain hardening for MIRR compiler
# Run: cargo deny check

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436", # paste is no longer maintained, nested dep of candle
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "GPL-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSD-1-Clause",
    "LGPL-2.1-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
