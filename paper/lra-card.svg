<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>MIRR: A Safety-Critical HDL Compiler</title>
  <desc>Social card for the MIRR Living Research Artifact</desc>
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#060a14"/>
  <rect width="1200" height="4" fill="url(#titleGrad)"/>
  <!-- Title -->
  <text x="600" y="230" text-anchor="middle" fill="url(#titleGrad)"
    font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="bold">
    MIRR: A Safety-Critical HDL Compiler
  </text>
  <!-- Subtitle -->
  <text x="600" y="300" text-anchor="middle" fill="#b0bec5"
    font-family="system-ui, -apple-system, sans-serif" font-size="28">
    Living Research Artifact — Compiler runs in your browser
  </text>
  <!-- Divider -->
  <line x1="400" y1="350" x2="800" y2="350" stroke="#1a2340" stroke-width="1"/>
  <!-- Stats -->
  <text x="600" y="410" text-anchor="middle" fill="#64748b"
    font-family="system-ui, -apple-system, sans-serif" font-size="22">
    GPL-3.0-or-later · 2,491 tests · 55 Rocq theorems · 9 backends
  </text>
  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" fill="#475569"
    font-family="monospace" font-size="18">
    brandonfromph.github.io/mirr-project
  </text>
</svg>
