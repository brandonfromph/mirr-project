<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 280">
  <title>MIRR: A Safety-Critical HDL Compiler</title>
  <desc>Social card for the MIRR Living Research Artifact</desc>
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect width="888" height="280" rx="6" fill="#060a14"/>
  <rect width="888" height="3" rx="1.5" fill="url(#titleGrad)"/>
  <!-- Title -->
  <text x="444" y="90" text-anchor="middle" fill="url(#titleGrad)"
    font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="bold">
    MIRR: A Safety-Critical HDL Compiler
  </text>
  <!-- Subtitle -->
  <text x="444" y="135" text-anchor="middle" fill="#b0bec5"
    font-family="system-ui, -apple-system, sans-serif" font-size="20">
    Living Research Artifact — Compiler runs in your browser
  </text>
  <!-- Divider -->
  <line x1="294" y1="165" x2="594" y2="165" stroke="#1a2340" stroke-width="1"/>
  <!-- Stats -->
  <text x="444" y="200" text-anchor="middle" fill="#64748b"
    font-family="system-ui, -apple-system, sans-serif" font-size="16">
    GPL-3.0 · 2,601 tests · 55 Rocq theorems · 9 backends
  </text>
  <!-- URL -->
  <text x="444" y="250" text-anchor="middle" fill="#475569"
    font-family="monospace" font-size="14">
    brandonfromph.github.io/mirr-project
  </text>
</svg>
