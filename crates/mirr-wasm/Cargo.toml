[package]
name = "mirr-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for the MIRR compiler"
authors = ["Brandon <brandonfromph@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/brandonfromph/mirr-project"
readme = "README.md"
keywords = ["wasm", "compiler", "hardware", "dsl"]
categories = ["wasm"]
rust-version = "1.70"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mirrc = { path = "../..", version = "0.3.0" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
