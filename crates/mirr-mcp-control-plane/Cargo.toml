[package]
name = "mirr-mcp-control-plane"
version = "0.1.0"
edition = "2021"
description = "MIRR Model Context Protocol (MCP) control-plane bridge"
authors = ["Brandon <brandonfromph@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/brandonfromph/mirr-project"
readme = "README.md"
keywords = ["mcp", "control-plane", "governance", "safety-critical"]
categories = ["asynchronous", "network-programming"]
rust-version = "1.70"

[dependencies]
axum = { version = "0.6", features = ["http1", "json"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
hyper = { version = "0.14", features = ["http1", "server"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
