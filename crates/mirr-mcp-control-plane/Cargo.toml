[package]
name = "mirr-mcp-control-plane"
version = "0.1.0"
edition = "2021"
description = "Rust MIRR control-plane"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.6", features = ["http1", "json"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
hyper = { version = "0.14", features = ["http1", "server"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
