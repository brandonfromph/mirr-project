[package]
name = "mirr-arsenal-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for the MIRR compiler semantic bridge"
authors = ["Brandon <brandonfromph@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/brandonfromph/mirr-project"
readme = "README.md"
keywords = ["wasm", "validation", "hardware", "dsl"]
categories = ["wasm"]
rust-version = "1.70"


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mirrc = { path = "../..", version = "0.3.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
