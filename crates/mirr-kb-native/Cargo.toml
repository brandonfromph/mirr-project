[package]
name = "mirr-kb-native"
version = "0.1.0"
edition = "2021"
description = "MIRR native Rust RAG core with semantic and lexical retrieval"
authors = ["Brandon <brandonfromph@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/brandonfromph/mirr-project"
readme = "README.md"
keywords = ["rag", "semantic-search", "sqlite", "embedding", "safety-critical"]
categories = ["database-implementations", "text-processing"]
rust-version = "1.70"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
async-trait = "0.1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "full"] }
sha2 = "0.10"
walkdir = "2"
clap = { version = "4.6.0", features = ["derive"] }
futures = "0.3.32"
tokenizers = "0.23.1"
rayon = "1.12.0"
hf-hub = "0.5.0"
memmap2 = "0.9.10"
safetensors = "0.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10.2", features = ["metal"] }
candle-nn = { version = "0.10.2", features = ["metal"] }
candle-transformers = { version = "0.10.2", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.10.2" }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }

# Optional: vector store adapters (feature-gated for future use)
# qdrant-client = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# [[feature]]
# qdrant = ["qdrant-client"]
