[package]
name = "nasa-rust-project"
version = "0.3.0"
edition = "2021"
description = "MIRR compiler — a safety-critical DSL for hardware-software co-design targeting SystemVerilog RTL"
authors = ["Brandon <brandonfromph@users.noreply.github.com>"]
license = "GPL-3.0"
repository = "https://github.com/brandonfromph/mirr-project"
readme = "README.md"
keywords = ["compiler", "hardware", "safety-critical", "verilog", "dsl"]
categories = ["compilers", "embedded", "hardware-support"]
rust-version = "1.70"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
glob = "0.3.3"
rand = "0.10.0"
regex = "1.12.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"
mirr-kb-native = { path = "crates/mirr-kb-native" }
walkdir = "2"
rayon = "1.10.0"
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "full"] }
futures = "0.3.32"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"

[profile.dev]
incremental = true
opt-level = 0

[profile.test]
incremental = true
opt-level = 0
debug = "full"
overflow-checks = true

[profile.release]
codegen-units = 1
debug = true
incremental = false
opt-level = "s"
panic = "abort"
lto = "fat"

[[bin]]
name = "mirr-compile"
path = "src/bin/mirr-compile/main.rs"

[[bin]]
name = "mirrc"
path = "src/bin/mirrc.rs"

[[bin]]
name = "mirr-lsp"
path = "src/bin/mirr-lsp.rs"

[[bin]]
name = "mirr-hydrate"
path = "src/bin/mirr-hydrate.rs"

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "rspu_bench"
harness = false

[[bench]]
name = "sexpr_bench"
harness = false

[[bench]]
name = "emit_analysis_bench"
harness = false

[workspace]
members = [".", "crates/mirr-wasm", "crates/lra-cli", "crates/mirr-arsenal-wasm", "crates/mirr-mcp-control-plane", "crates/mirr-kb-native"]

[workspace.metadata.mirr.fuzz]
targets = [
	"fuzz_parse_mirr",
	"fuzz_pipeline",
	"fuzz_typeck",
	"fuzz_width",
	"fuzz_sexpr_roundtrip",
	"fuzz_temporal",
]
required_seed_files_per_target = 1

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
