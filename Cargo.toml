[package]
name = "nasa-rust-project"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
debug = true
incremental = false
opt-level = "s"
panic = "abort"
lto = "fat"

[[bin]]
name = "mirr-compile"
path = "src/bin/mirr-compile.rs"

